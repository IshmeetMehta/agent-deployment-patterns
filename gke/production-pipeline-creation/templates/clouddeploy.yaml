apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: ${APP_NAME}-delivery-pipeline
  labels:
    app: ${APP_NAME}
spec:
  description: CD pipeline for ${APP_NAME}
  serialPipeline:
    stages:
      - targetId: ${APP_NAME}-dev
        profiles: ["dev"]
      - targetId: ${APP_NAME}-qa
        profiles: ["qa"]
        strategy:
          standard:
            predeploy:
              actions: []
            postdeploy:
              actions: []
            verify: false
          
      - targetId: ${APP_NAME}-prod
        profiles: ["prod"] # Use 'prod' profile for production
        strategy:
          standard:
            postdeploy:
              actions: []
            predeploy:
              actions: []
            verify: false
        deployParameters:
        - values:
            gke-cluster: projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/clusters/${GKE_CLUSTER_NAME}
          matchTargetLabels:
            environment: prod

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: ${APP_NAME}-dev
  labels:
    app: ${APP_NAME}
    environment: dev
spec:
  description: Development environment for ${APP_NAME}
  gke:
    cluster: projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/clusters/${GKE_CLUSTER_NAME}
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: ${APP_NAME}-qa
  labels:
    app: ${APP_NAME}
    environment: qa
spec:
  description: QA environment for ${APP_NAME}
  requireApproval: true # Require manual approval for QA
  gke:
    cluster: projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/clusters/${GKE_CLUSTER_NAME}
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: ${APP_NAME}-prod
  labels:
    app: ${APP_NAME}
    environment: prod
spec:
  description: Production environment for ${APP_NAME}
  requireApproval: true # Require manual approval for production
  gke:
    cluster: projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/clusters/${GKE_CLUSTER_NAME}
---
apiVersion: deploy.cloud.google.com/v1
kind: Automation
metadata:
  name: ${APP_NAME}-pipeline/rollout-automation
description: Automates promotion of successful rollouts and handles repair for failed ones.
suspended: false
serviceAccount: clouddeploy-sa@${GCP_PROJECT_ID}.iam.gserviceaccount.com
selector:
  targets:
  - id: "*"
rules:
- promoteReleaseRule:
    id: "promote-release"
    wait: 0m
    destinationTargetId: "@next"
- repairRolloutRule:
    id: "rollback-release"
    repairPhases:
    - retry:
        attempts: 2
        wait: 0m
        backoffMode: LINEAR
    - rollback:
        destinationPhase: stable
