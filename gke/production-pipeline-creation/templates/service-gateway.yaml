apiVersion: v1
kind: Service
metadata:
  name: ${DOCKER_IMAGE_NAME}-service-clusterip
  namespace: ${NAMESPACE_NAME}
  labels:
    app: ${DOCKER_IMAGE_NAME}
spec:
  selector:
    app: ${DOCKER_IMAGE_NAME}
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: ${APP_NAME}-gateway
  namespace: ${NAMESPACE_NAME}
spec:
  gatewayClassName: gke-l7-global-external-managed # Or another GatewayClass based on your cluster setup
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: ${APP_NAME}-http-route
  namespace: ${NAMESPACE_NAME}
spec:
  parentRefs:
  - name: ${APP_NAME}-gateway
  hostnames:
  - "${APP_NAME}.example.com" # Replace with your actual hostname
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: ${DOCKER_IMAGE_NAME}-service-clusterip
      port: 80
