# Cloud Build configuration for Vertex AI Gen AI Evaluation
# This file is used to run model and agent evaluations before deployment.

steps:
- name: 'python:3.10'
  id: genai-evaluation
  entrypoint: bash
  args:
  - -c
  - |
    # Install the Vertex AI SDK and evaluation requirements
    pip install google-cloud-aiplatform requests pandas

    # Run the evaluation script
    # This script calls the agent at _AGENT_URL, collects responses,
    # and evaluates them using Vertex AI Rapid Evaluation.
    python tests/eval_agent.py \
      --agent_url=${_AGENT_URL} \
      --project=${_GCP_PROJECT_ID} \
      --location=${_GCP_REGION}

substitutions:
  _AGENT_URL: 'http://my-agent.my-agent.svc.cluster.local'
  _GCP_PROJECT_ID: 'my-project-123'
  _GCP_REGION: 'us-central1'

# Example evaluation results can be exported as artifacts or used to gate the build.
# A failure in the evaluation script should return a non-zero exit code to block deployment.
